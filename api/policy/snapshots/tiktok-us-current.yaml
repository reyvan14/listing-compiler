# Bundled policy snapshot — dated excerpt of TikTok Shop US seller guidance.
platform: tiktok
market: US
version: tiktok-us-2025.03
status: current
effective_date: "2025-03-01"
excerpt_date: "2026-08-25"
source_name: TikTok Shop 美国卖家大学 — Listing 优化
source_url: https://seller-us.tiktok.com/university/essay?knowledge_id=7073362639816491&lang=en
summary: >-
  商品标题 25–200 字符；商品卡主图偏白底、无加字，且不同于信息流广告封面。
display:
  name: TikTok Shop
  role: 货架 · 连着内容
  image_label: 商品卡主图
  image_summary: 商品卡主图偏白底、无加字；≠ 信息流广告封面
notes: >-
  已对照 source_url 摘录复核标题阈值，发布规则仍写 25–200 字符。TikTok 另一个
  “Product Detail Pages & Listing Quality Guidelines”页面将 Good 质量档写为 25–255；
  两页口径不一致，因此本工具采用更保守的 25–200 作为发布前校验，不把 255
  误写成统一硬性上限。
reference_name: TikTok Shop — Product Detail Pages & Listing Quality Guidelines
reference_url: https://seller-us.tiktok.com/university/essay?identity=1&knowledge_id=481891871868714&role=1
rules:
  - id: tiktok.title.min_length
    kind: title_min_length
    field: tiktok:title
    severity: warn
    params:
      min: 25
    description: 商品标题不少于 25 字符。
  - id: tiktok.title.max_length
    kind: title_max_length
    field: tiktok:title
    severity: warn
    params:
      max: 200
    description: 商品标题不超过 200 字符。
  - id: tiktok.main_image.clean
    kind: text
    field: tiktok:main_image
    severity: warn
    params: {}
    description: 商品卡主图偏白底、无加字；信息流广告封面是另一套素材，走投放条。
