# Bundled policy snapshot — dated excerpt of Shopify product media help.
platform: shopify
market: US
version: shopify-2025.03
status: current
effective_date: "2025-03-01"
excerpt_date: "2026-08-25"
source_name: Shopify 商品媒体帮助
source_url: https://help.shopify.com/en/manual/products/product-media/product-media-types
summary: >-
  商品媒体无强制白底，生活图 / 场景图可用；建议品牌标题 + 长描述而非五点模板。
display:
  name: Shopify
  role: 品牌站
  image_label: 品牌站生活图
  image_summary: 无强制白底，生活图可用
notes: 品牌站不强制白底，无标题长度硬性上限。
rules:
  - id: shopify.product_media.no_white_required
    kind: text
    field: shopify:main_image
    severity: warn
    params: {}
    description: 商品媒体无强制白底，生活图 / 场景图可用。
  - id: shopify.product_media.format
    kind: image_format
    field: shopify:main_image
    severity: blocking
    params:
      allowed: ["JPEG", "PNG", "WEBP", "GIF"]
    description: 商品媒体格式需为 JPEG / PNG / WEBP / GIF。
  - id: shopify.product_media.min_dimensions
    kind: image_min_dimensions
    field: shopify:main_image
    severity: warn
    params:
      min_width: 800
      min_height: 800
    description: 建议每边不小于 800px，低于该尺寸在高分屏上会发虚。
  - id: shopify.product_media.max_bytes
    kind: image_max_bytes
    field: shopify:main_image
    severity: blocking
    params:
      max: 20971520
    description: 单个图片文件不得超过 20 MB。
  - id: shopify.copy.brand_voice
    kind: text
    field: shopify:description
    severity: warn
    params: {}
    description: 建议品牌标题 + 长描述，而非货架式五点模板。
