# Bundled CANDIDATE policy snapshot — a dated excerpt of an announced, not-yet-
# adopted Amazon US title policy. Never treated as the current rule set until a
# migration is explicitly approved in the UI.
platform: amazon
market: US
version: amazon-us-2026.03-candidate
status: candidate
effective_date: "2026-03-15"
excerpt_date: "2026-08-25"
source_name: Amazon Seller Forums — 商品标题政策更新公告
source_url: https://sellercentral.amazon.com/seller-forums/discussions/t/b2b15728-0d43-453e-974f-59eb63f73059/
reference_name: Amazon Seller Central 产品图片与标题要求 (G1881)
reference_url: https://sellercentral.amazon.com/help/hub/reference/external/G1881
summary: >-
  公告收紧美国站商品标题：多数分类标题上限降至 80 字符并强制执行；标题不得包含特殊字符
  (! $ ? _ { } ^ ¬ ¦)；同一非豁免词在标题中出现不得超过两次。主图要求不变。
display:
  name: Amazon
  role: 货架
  image_label: 白底主图 1:1
  image_summary: 纯白 RGB 255,255,255 · 主体约 85% · 主图禁加字
notes: >-
  与 amazon-us-2025.03 的差异：标题长度上限 200 → 80 且由建议(warn)升为强制(blocking)；
  新增禁用字符规则；新增同词重复上限规则。
rules:
  - id: amazon.title.max_length
    kind: title_max_length
    field: amazon:title
    severity: blocking
    params:
      max: 80
    description: 标题不得超过 80 字符（多数美国站分类强制执行）。
  - id: amazon.title.prohibited_chars
    kind: prohibited_chars
    field: amazon:title
    severity: blocking
    params:
      chars: "!$?_{}^¬¦"
    description: 标题不得包含特殊字符 ! $ ? _ { } ^ ¬ ¦。
  - id: amazon.title.repeated_word_limit
    kind: repeated_word_limit
    field: amazon:title
    severity: blocking
    params:
      limit: 2
      exempt: ["a", "an", "the", "and", "or", "for", "with", "in", "on", "of", "to", "by"]
    description: 同一非豁免词在标题中出现不得超过两次。
  - id: amazon.main_image.white_background
    kind: image_white_background
    field: amazon:main_image
    severity: warn
    params: {}
    description: 主图纯白背景（RGB 255,255,255），主体占比 ≥ 85%，不叠加文字 / logo / 边框 / 水印。
